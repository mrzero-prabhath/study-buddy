<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Buddy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
        }

        header p {
            margin-top: 6px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .welcome h2 {
            margin-bottom: 10px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .subject {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .video-card {
            grid-column: 1 / -1;
        }

        .video-card iframe {
            width: 100%;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Study Buddy</h1>
        <p>Your A/L Learning Library</p>
    </header>

    <div class="container">

        <div class="welcome">
            <h2>Welcome to Study Buddy</h2>
            <p>
                Learn A/L lessons through organized video lessons.
            </p>
        </div>

        <div class="subjects" id="videoContainer">

            <div class="subject">
                <h3>📐 Combined Maths</h3>
                <p>Lessons & Videos</p>
            </div>

            <div class="subject">
                <h3>⚡ Physics</h3>
                <p>Lessons & Videos</p>
            </div>

            <div class="subject">
                <h3>🧪 Chemistry</h3>
                <p>Lessons & Videos</p>
            </div>

            <div class="subject">
                <h3>💻 ICT</h3>
                <p>Lessons & Videos</p>
            </div>

        </div>

    </div>

    <footer>
        Study Buddy © 2026
    </footer>


    <!-- Firebase -->
    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        // Firebase configuration
        const firebaseConfig = {

            apiKey: "AIzaSyDdYTdjchyP1823ik4yBqbo3JYGuaq2ZYE",

            authDomain: "study-buddy-49c4a.firebaseapp.com",

            projectId: "study-buddy-49c4a",

            storageBucket: "study-buddy-49c4a.firebasestorage.app",

            messagingSenderId: "63673995228",

            appId: "1:63673995228:web:f6699dc20f4b14d5398919"

        };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        // Video container
        const videoContainer =
            document.getElementById("videoContainer");


        // Load videos from Firestore
        async function loadVideos() {

            try {

                const snapshot =
                    await getDocs(collection(db, "videos"));


                snapshot.forEach((doc) => {

                    const video = doc.data();

                    const videoId =
                        getYouTubeVideoId(video.youtubeUrl);


                    if (!videoId) {
                        return;
                    }


                    const card =
                        document.createElement("div");

                    card.className = "video-card";


                    card.innerHTML = `

                        <div style="
                            background:white;
                            padding:20px;
                            border-radius:15px;
                            box-shadow:0 5px 20px rgba(0,0,0,0.08);
                        ">

                            <h2>
                                ${video.title || "Untitled Video"}
                            </h2>

                            <p style="
                                margin-top:8px;
                                color:#666;
                            ">
                                ${video.subject || ""}
                                •
                                ${video.chapter || ""}
                            </p>

                            <div style="
                                margin-top:15px;
                            ">

                                <iframe

                                    height="400"

                                    src="https://www.youtube.com/embed/${videoId}"

                                    title="${video.title || "Study Buddy Video"}"

                                    frameborder="0"

                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                                    allowfullscreen>

                                </iframe>

                            </div>

                        </div>

                    `;


                    videoContainer.appendChild(card);

                });


            } catch (error) {
    console.error("Firebase error:", error);
}
        }


        // Convert YouTube URL → Video ID
        function getYouTubeVideoId(url) {

            try {

                const parsed =
                    new URL(url);


                // youtu.be/VIDEO_ID
                if (
                    parsed.hostname.includes("youtu.be")
                ) {

                    return parsed.pathname
                        .substring(1)
                        .split("/")[0];

                }


                // youtube.com
                if (
                    parsed.hostname.includes("youtube.com")
                ) {

                    // youtube.com/watch?v=VIDEO_ID
                    if (
                        parsed.pathname === "/watch"
                    ) {

                        return parsed.searchParams
                            .get("v");

                    }


                    // youtube.com/embed/VIDEO_ID
                    if (
                        parsed.pathname.startsWith("/embed/")
                    ) {

                        return parsed.pathname
                            .split("/embed/")[1]
                            .split("/")[0];

                    }


                    // youtube.com/shorts/VIDEO_ID
                    if (
                        parsed.pathname.startsWith("/shorts/")
                    ) {

                        return parsed.pathname
                            .split("/shorts/")[1]
                            .split("/")[0];

                    }

                }


                return null;

            } catch (error) {

                console.error(
                    "Invalid YouTube URL:",
                    url
                );

                return null;

            }

        }


        // Start loading
        loadVideos();

    </script>

</body>
</html>
